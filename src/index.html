<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="stilosinventsario.css">
    <title>TechStore</title>
</head>
<body>
    <div class="app-layout">
  <aside class="sidebar">
    <div class="logo">
        <img src="" alt="logo">
        <h2>TECH STORE</h2>
    </div>
    <div class="estado_de_la_tienda">
        <h3> TechStore</h3>
        <button>cambiar</button>
    </div>
    

    <nav class="botones">
  <button>
    <span class="texto">Inicio</span>
  </button>

  <button>
    <span class="texto">Inventario</span>
    <span class="contador" id="contador-inventario">0</span>
  </button>

  <button>
    <span class="texto">Ventas</span>
    <span class="contador rosado">2</span>
  </button>

  <button>
    <span class="texto">Clientes</span>
  </button>

  <button>
    <span class="texto">Reportes</span>
  </button>
  </nav>
  </aside>

  <main class="main-content">
    <section class = "cuadro_superior">
        <div class = "info_superior">
          <h1>Gestión de Inventario</h1>
          <p>Administra productos, precios y existencias.</p>
        </div>
        <div class="botones_inventario">
          <button>Agregar Producto</button>
          <button>Quitar Ultimo</button>
        </div>
    </section>

    <section class="inventory-panel">
      <input  class="barra_buscar"type="search" placeholder="Buscar producto o código">
    
      <table>
        <thead>
          <tr>
            <th>Código</th> 
            <th>Producto</th>
            <th>Precio</th>
            <th>Unidades</th>
            <th>Estado</th>
          </tr>
        </thead>
        <tbody id="lista-productos"></tbody>
      </table>
      
    </section>
  </main>
</div>
    
</body>
</html>
